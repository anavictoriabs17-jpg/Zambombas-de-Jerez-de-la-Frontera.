<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Ana Victoria</title>
    <style>
        body {
            background-color: #ff69b4; /* Fondo rosa */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff; /* Texto en blanco */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 2rem;
            margin-top: 0;
            font-weight: 300;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>¡Hola, mundo!</h1>
    <h2>Ana Victoria Bazán</h2>
    <p>Este es el contenido visible de la página.</p>

</body>
</html>
