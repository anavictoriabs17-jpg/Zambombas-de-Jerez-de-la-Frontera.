<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANA VICTORIA BAZÁN</title>
    <style>
        /* Estilos globales inspirados en ZARA */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Times New Roman', Times, Baskerville, Georgia, serif;
            letter-spacing: 0.8px;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Menú superior sobrio y en mayúsculas */
        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 60px;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 2px;
        }

        nav a {
            color: #000000;
            text-decoration: none;
            margin-left: 20px;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 0.5;
        }

        /* Contenido Principal */
        main {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .brand-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            color: #666666;
        }

        h2 {
            font-size: 2.8rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            line-height: 1.1;
        }

        p.description {
            font-size: 0.95rem;
            max-width: 450px;
            color: #333333;
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* Reproductor de video integrado con estética minimalista */
        .video-container {
            width: 100%;
            max-width: 700px;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            margin-bottom: 20px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-link {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #000000;
            text-decoration: none;
            border-bottom: 1px solid #000000;
            padding-bottom: 2px;
            transition: opacity 0.2s;
        }

        .video-link:hover {
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">ZARA STYLE CONCEPT</div>
        <nav>
            <a href="#inicio">INICIO</a>
            <a href="#video">MÚSICA</a>
        </nav>
    </header>

    <main id="inicio">
        <h2>ANA VICTORIA BAZÁN</h2>
        <p class="description">Este es el contenido visible de la página.</p>

        <div id="video" class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/7oHOR72v-tU" 
                title="ASI CANTA JEREZ EN NAVIDAD - JALEO - 2023 LIVE" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <a class="video-link" href="http://www.youtube.com/watch?v=7oHOR72v-tU" target="_blank" rel="noopener noreferrer">
            VER EN YOUTUBE — ASI CANTA JEREZ EN NAVIDAD [00:00:00]
        </a>
    </main>

</body>
</html>
